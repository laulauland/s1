[workspace]
members = ["."]
resolver = "3"

[package]
name = "s1"
version = "0.1.0"
edition = "2024"
description = "Local gateway daemon and CLI for System One models"
publish = false

[[bin]]
name = "s1"
path = "src/main.rs"

[lib]
name = "s1"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
blake3 = "1.8.7"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
flate2 = "1.1.9"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
redb = "4.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
zstd = "0.13.3"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["test-util"] }

# The cache tests write thousands of redb transactions.
[profile.dev.package.redb]
opt-level = 3
