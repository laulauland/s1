# Compiled-in catalog for the four v1 backends.
# Users add or override any field in ~/.config/s1/models.toml.
# Model IDs are `provider/model`. Sources: /docs/spec.md and provider docs
# (TypeSafe models page, Workers AI Clef/Clairic pages, OpenAI gpt-6-luna page).

[providers.typesafe]
base_url = "https://api.typesafe.ai"
api = "systemone"
auth = "typesafe"

[[providers.typesafe.models]]
id = "jev-latest"
upstream = "jev-latest"
context_tokens = 65536
max_options = 255
max_levels = 10
question_context_tokens = 32768
long_context_tokens = 262144
images = "preview"
compat = { noul_confidence = false, box = false }

[[providers.typesafe.models]]
id = "jev-preview"
upstream = "jev-preview"
context_tokens = 65536
max_options = 255
max_levels = 10
question_context_tokens = 32768
long_context_tokens = 262144
images = "preview"
compat = { noul_confidence = false, box = true }

[providers.workers-ai]
base_url = "https://api.cloudflare.com/client/v4"
api = "systemone"
auth = "workers-ai"

[[providers.workers-ai.models]]
id = "clef"
upstream = "clef"
context_tokens = 65536
max_options = 255
max_levels = 10
min_options = 2
min_levels = 2
max_questions = 64
images = "yes"
# Clef takes images as an `images` array (data URLs), not TypeSafe `assets`,
# and rejects unknown top-level fields. Every question needs `instructions`
# (not null or blank),
# and question names are `[A-Za-z0-9_.-]`, 1 to 100 characters.
compat = { noul_confidence = false, silent_truncation = true, assets = false, images_array = true, instructions_required = true, strict_question_names = true }

[[providers.workers-ai.models]]
id = "clef-flash"
upstream = "clef-flash"
context_tokens = 24576
max_options = 255
max_levels = 10
min_options = 2
min_levels = 2
max_questions = 64
images = "yes"
compat = { noul_confidence = false, silent_truncation = true, assets = false, images_array = true, instructions_required = true, strict_question_names = true }

[[providers.workers-ai.models]]
id = "clairic"
api = "clairic"
upstream = "clairic"
context_tokens = 65536
images = "yes"

[providers.openai]
base_url = "https://api.openai.com/v1"
api = "openai-decisions"
auth = "openai"

[[providers.openai.models]]
id = "gpt-6-luna"
upstream = "gpt-6-luna"
context_tokens = 922000
max_options = 255
min_options = 2
max_levels = 10
min_levels = 2
max_questions = 400
images = "yes"
# Systemone requests are translated: `assets` and Clef `images` both become
# `input_image` parts; `box` has no OpenAI form.
compat = { noul_confidence = false, images_array = true, box = false }

[aliases.decide]
models = ["workers-ai/clef-flash", "typesafe/jev-latest"]
spill = false

[aliases.extract]
models = ["workers-ai/clairic"]
spill = false

# Limits per provider (spec "Backpressure and rate limits"). PLACEHOLDERS:
# replace them with your account's real limits in ~/.config/s1/models.toml.
# Every field is optional; see `crate::limits::Limits` for all of them.
[limits.typesafe]
rpm = 600
tpm = 2_000_000
max_in_flight = 32
adaptive = true

# Workers AI text-generation default is 300 requests per minute (Clef and
# Clairic buckets are not documented).
[limits.workers-ai]
rpm = 300
tpm = 2_000_000
max_in_flight = 16
adaptive = true

# gpt-6-luna "Build" tier defaults (Decisions-specific limits unknown).
[limits.openai]
rpm = 5_000
tpm = 2_000_000
max_in_flight = 32
adaptive = true
